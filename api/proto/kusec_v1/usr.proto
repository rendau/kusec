syntax = "proto3";

package kusec_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "kusec_v1/common.proto";

option go_package = "/kusec_v1";

service Usr {
  rpc List(UsrListReq) returns (UsrListRep) {
    option (google.api.http) = {
      get: "/usr"
    };
  }

  rpc Get(UsrGetReq) returns (UsrMain) {
    option (google.api.http) = {
      get: "/usr/{id}"
    };
  }

  rpc Create(UsrCreateReq) returns (UsrCreateRep) {
    option (google.api.http) = {
      post: "/usr"
      body: "*"
    };
  }

  rpc Update(UsrUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/usr/{id}"
      body: "*"
    };
  }

  rpc Delete(UsrGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/usr/{id}"
    };
  }

  rpc Login(UsrLoginReq) returns (UsrLoginRep) {
    option (google.api.http) = {
      post: "/usr/login"
      body: "*"
    };
  }

  rpc RefreshToken(UsrRefreshTokenReq) returns (UsrLoginRep) {
    option (google.api.http) = {
      post: "/usr/token/refresh"
      body: "*"
    };
  }

  // Logout — выход: гасит все выданные текущему пользователю токены
  // (access и refresh, на всех устройствах).
  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/usr/logout"
    };
  }

  rpc BootstrapStatus(google.protobuf.Empty) returns (UsrBootstrapStatusRep) {
    option (google.api.http) = {
      get: "/usr/bootstrap/status"
    };
  }

  rpc GetProfile(google.protobuf.Empty) returns (UsrMain) {
    option (google.api.http) = {
      get: "/usr/profile"
    };
  }

  rpc UpdateProfile(UsrUpdateProfileReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/usr/profile"
      body: "*"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message UsrMain {
  int64 id = 1;
  bool active = 2;
  bool is_admin = 3;
  string name = 4;
  string username = 5;
  // app_ids — приложения, доступные не-админу при all_apps=false.
  // Пустой список = не доступно ни одно.
  repeated string app_ids = 6;
  // 7 — totp_enabled: 2FA убрана.
  reserved 7;
  reserved "totp_enabled";
  // all_apps — не-админ видит все приложения (app_ids не учитывается).
  // У админа доступ ко всему всегда.
  bool all_apps = 8;
}

// List

message UsrListReq {
  ListParamsSt list_params = 1;
  optional bool active = 2;
  optional bool is_admin = 3;
  optional string search = 4;
  // app_id — только пользователи с доступом к этому приложению: админы,
  // пользователи с all_apps=true и пользователи с ним в app_ids.
  optional string app_id = 5;
}

message UsrListRep {
  PaginationInfoSt pagination_info = 1;
  repeated UsrMain results = 2;
}

// Get

message UsrGetReq {
  int64 id = 1;
}

// Create

message UsrCreateReq {
  optional bool active = 1;
  bool is_admin = 2;
  string name = 3;
  string username = 4;
  string password = 5;
  repeated string app_ids = 6;
  bool all_apps = 7;
}

// Create response

message UsrCreateRep {
  int64 id = 1;
}

// Update

message UsrUpdateReq {
  int64 id = 1;
  optional bool active = 2;
  optional bool is_admin = 3;
  optional string name = 4;
  optional string username = 5;
  optional string password = 6;
  // app_ids заменяется целиком на каждый Update (пустой список = ни одного
  // приложения).
  repeated string app_ids = 7;
  // all_apps — не передан: флаг не меняется.
  optional bool all_apps = 8;
}

// Auth

message UsrLoginReq {
  string username = 1;
  string password = 2;
  // 3 — totp_code: 2FA убрана.
  reserved 3;
  reserved "totp_code";
}

message UsrLoginRep {
  string jwt = 1;
  string refresh_token = 2;
  // 3, 4, 5 — totp_required/totp_setup_required/setup_token: 2FA убрана.
  reserved 3, 4, 5;
  reserved "totp_required", "totp_setup_required", "setup_token";
}

message UsrRefreshTokenReq {
  string refresh_token = 1;
}

message UsrBootstrapStatusRep {
  bool can_create_first_admin = 1;
}

message UsrUpdateProfileReq {
  optional string name = 1;
  optional string password = 2;
  optional string username = 3;
  // current_password — текущий пароль; обязателен, если меняется password
  // или username. Неверный или пустой — ошибка current_password_invalid.
  optional string current_password = 4;
}

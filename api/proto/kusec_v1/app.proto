syntax = "proto3";

package kusec_v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "kusec_v1/common.proto";

option go_package = "/kusec_v1";

service App {
  rpc List(AppListReq) returns (AppListRep) {
    option (google.api.http) = {
      get: "/app"
    };
  }

  rpc Get(AppGetReq) returns (AppMain) {
    option (google.api.http) = {
      get: "/app/{id}"
    };
  }

  // Поиск app и его secret/configmap по имени k8s-объекта (например из
  // envFrom пода или аннотации reloader). Объявлен ПОСЛЕ Get намеренно:
  // gateway-mux prepend-ит хендлеры (последний зарегистрированный
  // проверяется первым), поэтому только так /app/resolve не
  // перехватывается шаблоном /app/{id}.
  rpc Resolve(AppResolveReq) returns (AppResolveRep) {
    option (google.api.http) = {
      get: "/app/resolve"
    };
  }

  // Все ключи app (secret + configmap) без значений: размер, HMAC-отпечаток,
  // кто и когда менял, применён ли ключ в кластер последним sync-ом.
  rpc Keys(AppGetReq) returns (AppKeysRep) {
    option (google.api.http) = {
      get: "/app/{id}/keys"
    };
  }

  // Сравнение kusec ↔ кластер по ключам (имена ключей, без значений).
  rpc Drift(AppGetReq) returns (AppDriftRep) {
    option (google.api.http) = {
      get: "/app/{id}/drift"
    };
  }

  rpc Create(AppCreateReq) returns (AppCreateRep) {
    option (google.api.http) = {
      post: "/app"
      body: "*"
    };
  }

  rpc Update(AppUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/app/{id}"
      body: "*"
    };
  }

  rpc Delete(AppGetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/app/{id}"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message AppMain {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  bool active = 4;
  string namespace = 5;
  string name = 6;
  string slug_name = 8;
  string description = 7;
}

// List

message AppListReq {
  ListParamsSt list_params = 1;
  optional bool active = 2;
  optional string namespace = 3;
  optional string search = 4;
  // Границы по времени изменения (RFC3339): updated_at >= gte, < lt.
  optional google.protobuf.Timestamp updated_at_gte = 5;
  optional google.protobuf.Timestamp updated_at_lt = 6;
}

message AppListRep {
  PaginationInfoSt pagination_info = 1;
  repeated AppMain results = 2;
}

// Get

message AppGetReq {
  string id = 1;
}

// Create

message AppCreateReq {
  optional bool active = 1;
  string namespace = 2;
  string name = 3;
  string slug_name = 5;
  string description = 4;
}

message AppCreateRep {
  string id = 1;
}

// Resolve

message AppResolveReq {
  string namespace = 1;
  // имя k8s-объекта (Secret или ConfigMap), например kusec-caravan-main
  string kube_name = 2;
}

message AppResolveRep {
  // false — объект с таким именем в namespace не описан в kusec
  bool found = 1;
  AppMain app = 2;
  // Secret | ConfigMap
  string kube_kind = 3;
  // id записи kusec (secret или configmap)
  string object_id = 4;
  string object_slug = 5;
}

// Keys

message AppKeySt {
  string key = 1;
  // Secret | ConfigMap
  string kube_kind = 2;
  string kube_name = 3;
  bool is_secret = 4;
  bool active = 5;
  // размер значения в байтах и HMAC-отпечаток; само значение не отдаётся
  int64 value_size = 6;
  string value_hash = 7;
  google.protobuf.Timestamp updated_at = 8;
  // последний актор из аудита (пусто — изменений после включения аудита
  // не было)
  string updated_by = 9;
  // ключ применён в кластер: updated_at не позже последнего sync объекта
  bool synced = 10;
  // id item/config_item и родительского secret/configmap
  string item_id = 11;
  string parent_id = 12;
}

message AppKeysRep {
  repeated AppKeySt keys = 1;
}

// Drift

message AppDriftObjectSt {
  // Secret | ConfigMap
  string kube_kind = 1;
  string kube_name = 2;
  string namespace = 3;
  // id записи kusec (secret или configmap)
  string object_id = 4;
  bool exists_in_cluster = 5;
  // объект кластера под управлением kusec (лейбл managed-by)
  bool managed = 6;
  // имена ключей (значения не отдаются)
  repeated string missing_in_cluster = 7;
  repeated string extra_in_cluster = 8;
  repeated string value_differs = 9;
  // время последнего изменения в kusec, ещё не применённого в кластер
  // (null — изменений после последнего sync нет)
  optional google.protobuf.Timestamp not_synced_since = 10;
}

message AppDriftRep {
  // false — kusec запущен вне кластера, сравнение недоступно
  bool in_cluster = 1;
  repeated AppDriftObjectSt objects = 2;
}

// Update

message AppUpdateReq {
  string id = 1;
  optional bool active = 2;
  optional string namespace = 3;
  optional string name = 4;
  optional string slug_name = 6;
  optional string description = 5;
}
